## Welcome

This is the first lesson of your course. Replace this text with your own
introduction — what people will learn, who it's for, and anything they should
know before they start.

### How the course works

Each lesson is a separate page. Learners use the list on the left (or the
**Lessons** menu on a phone) to jump around, or the **Next** button at the
bottom of each page to go straight through in order.

There's no login and nothing to install — the whole course is just files, so it
works on a laptop, a phone, or completely offline.

- Edit this lesson in the file `lessons/01-welcome.html`.
