## Example lesson

This page is here to show what a finished lesson can look like. Everything on it
is written in markdown — the same simple formatting you'll use for your own
lessons. Open this file in an editor alongside the page to see how each part is
written.

### Start with a clear idea

Open a lesson by telling the learner what it's about in a sentence or two. Keep
paragraphs short. You can **emphasise** the important words, note a *term* in
italics, or link out to [another page](https://example.com) for more detail.

### Break things into steps

When you're explaining a process, a numbered list keeps it easy to follow:

1. State what the learner is trying to achieve.
2. Walk through it one step at a time.
3. Finish by showing what "done" looks like.

Or use bullets for points that don't have an order:

- a first point
- a second point
- a third point

### Use a table when you're comparing things

| Option   | Good for            | Watch out for        |
|----------|---------------------|----------------------|
| Option A | simple cases        | limited flexibility  |
| Option B | more control        | takes longer to set up |

### Call out what matters

> Use a note box like this for a key takeaway, a tip, or a warning — anything
> you want the learner to remember.

---

When you're ready, delete this example and write your own, or copy the lesson
template to start a fresh page.
