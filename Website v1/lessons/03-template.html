     HOW TO MAKE A NEW LESSON

<body data-page="lesson" data-root=".." data-file="03-template.html">

<script type="text/markdown" id="lesson-md">
## Your lesson title

Write normal paragraphs just like this. Leave a blank line between paragraphs.
You can make text **bold** or *italic*, or add a [link](https://example.com).

### A sub-heading

Use `##` for a main heading and `###` for a sub-heading.

A bulleted list:

- first point
- second point
- third point

A numbered list:

1. do this
2. then this
3. then this

A table (handy for comparisons):

| Column A | Column B |
|----------|----------|
| row one  | value    |
| row two  | value    |

A highlighted callout — start the line with `>`:

> This is a note box. Use it for tips, warnings or key takeaways.

To add a picture, put the image file in a folder (say `../assets/images/`) and
write:  `![describe the image](../assets/images/your-photo.jpg)`

---

That horizontal line above is just three dashes `---` on their own line.
Delete everything in this file and start writing when you're ready.
</script>

<script src="../assets/marked.js"></script>
<script src="../assets/lessons.js"></script>
<script src="../assets/site.js"></script>
