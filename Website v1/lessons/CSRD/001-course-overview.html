## Course overview

### Executive summary

The **Corporate Sustainability Reporting Directive (CSRD)** is the EU law that makes large companies publish standardised, independently checked sustainability information inside their annual management report. It matters commercially because investors, lenders and customers increasingly ask for this data, and because the rules sit alongside two other major EU regimes (the EU Taxonomy and the CSDDD). Since the 2026 "Omnibus" reforms it applies only to the largest EU companies (over 1,000 employees *and* over €450 million net turnover), plus qualifying non-EU groups. This course takes you from the basics to writing a compliant sustainability statement yourself.

<div class="callout warn"><div class="ic">⚠️</div><div><b>This regulation is changing</b><p>CSRD was heavily narrowed by <strong>Directive (EU) 2026/470</strong> (the "Omnibus I" Directive), in force since 18 March 2026. This course teaches the <em>current</em> rules and flags every point that changed recently, because older guides and articles still describe the original 2022 version.</p></div></div>

- **Directive (EU) 2026/470**: the Omnibus I Directive
- **Delegated Regulation (EU) 2023/2772**: the European Sustainability Reporting Standards (ESRS)
- **Directive 2013/34/EU**: the Accounting Directive that CSRD amends
