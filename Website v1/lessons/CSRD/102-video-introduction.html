## Video introduction

<figure>
  <div class="ph">Video goes here (3–6 minutes)</div>
  <figcaption>Welcome to Bushmont: the CSRD in five minutes.</figcaption>
</figure>

In this video you will hear:

- **The problem.** Investors and regulators could not trust or compare companies' sustainability claims, and greenwashing was rampant.
- **The fix.** The EU made sustainability reporting a legal, verified, standardised requirement, sitting inside the statutory management report rather than a voluntary glossy brochure.
- **The headline number.** CSRD now applies to large EU companies above €450m turnover *and* 1,000 employees.
- **Why it matters now.** CSRD is the reporting backbone that feeds two other major EU regimes (the EU Taxonomy and the CSDDD), so understanding it unlocks the rest of EU sustainability law.
