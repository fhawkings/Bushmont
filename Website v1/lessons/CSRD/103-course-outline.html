## Contents and course outline

This course has four parts. Each one has a different job, so you always know what you are meant to be getting from it.

<div class="grid cols-2">
  <div class="tile"><div class="ic">🧭</div><h4>1. Introduction</h4><p>What CSRD is, in plain English: key terms, aim, scope and the ideas behind it. About 12 minutes.</p></div>
  <div class="tile"><div class="ic">📘</div><h4>2. Core Content</h4><p>What the regulation actually requires: the rules, how it differs from other regimes, and the compliance checklist.</p></div>
  <div class="tile"><div class="ic">🛠️</div><h4>3. Applying the Regulation</h4><p>How a real company complies, using the fictional company Apex Holdings. <span class="badge">Coming soon</span></p></div>
  <div class="tile"><div class="ic">✅</div><h4>4. Exam</h4><p>You assess a realistic scenario and build a compliant sustainability statement yourself. <span class="badge">Coming soon</span></p></div>
</div>

<div class="callout"><div class="ic">💡</div><div><b>How the parts fit together</b><p>The Introduction tells you <em>what it is</em>, Core Content tells you <em>what it requires</em>, Applying shows you <em>how to do it</em>, and the Exam makes you <em>actually do it</em>.</p></div></div>
