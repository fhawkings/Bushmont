## What is the CSRD?

The **Corporate Sustainability Reporting Directive (CSRD)** is an EU law that requires large companies to publish detailed, standardised, externally verified information about their environmental, social and governance (ESG) impacts and risks. It is a mandatory part of their annual company filings, not an optional extra.

Legally, CSRD is not a standalone document you can read from start to finish. It is an **amending directive**: Directive (EU) 2022/2464, of 14 December 2022, which rewrites parts of four existing EU laws. The most important of these is the **Accounting Directive (2013/34/EU)**, which is where the reporting obligation now lives.

<div class="callout"><div class="ic">💡</div><div><b>An easy way to picture it</b><p>CSRD <em>inserted</em> a sustainability-reporting chapter into the rulebook that already governed companies' financial statements.</p></div></div>

## Key terms

Every term the course uses is defined here, once. Come back to this page whenever you need it.

<div class="glossary">
  <h4>Key terms</h4>
  <dl>
    <dt>CSRD</dt>
    <dd>Corporate Sustainability Reporting Directive: the EU law requiring sustainability reporting from large companies.</dd>
    <dt>ESRS</dt>
    <dd>European Sustainability Reporting Standards: the detailed disclosure standards a company must actually report against. CSRD is the "that you must"; the ESRS are the "how".</dd>
    <dt>NFRD</dt>
    <dd>Non-Financial Reporting Directive: CSRD's much narrower 2014 predecessor, which CSRD replaces.</dd>
    <dt>Management report</dt>
    <dd>The statutory narrative report companies already file alongside their financial statements. CSRD disclosures sit inside it, not in a separate document.</dd>
    <dt>Sustainability statement</dt>
    <dd>The specific section of the management report where CSRD disclosures live.</dd>
    <dt>Double materiality</dt>
    <dd>CSRD's core test. A topic must be reported if it is material <em>either</em> because the company's impact on people or the planet is significant (impact materiality) <em>or</em> because it creates a significant financial risk or opportunity for the company (financial materiality).</dd>
    <dt>In-scope undertaking</dt>
    <dd>A company that meets CSRD's size and turnover thresholds and therefore must comply.</dd>
    <dt>Value chain</dt>
    <dd>A company's upstream activities (suppliers) and downstream activities (customers, product use, disposal). CSRD requires reporting on material value chain impacts, not just direct operations.</dd>
    <dt>Limited assurance</dt>
    <dd>A moderate level of independent third-party checking. Less rigorous than the "reasonable assurance" applied to financial statements, but more than none.</dd>
    <dt>CSDDD (or CS3D)</dt>
    <dd>Corporate Sustainability Due Diligence Directive: a separate EU law on human rights and environmental due diligence in supply chains. Often confused with CSRD, but not the same law.</dd>
    <dt>Omnibus I</dt>
    <dd>The 2025–26 EU package, finalised as Directive (EU) 2026/470, that simplified and narrowed both CSRD and the CSDDD.</dd>
    <dt>VSME</dt>
    <dd>Voluntary SME standard: a lighter, non-mandatory reporting standard for smaller companies that fall outside CSRD.</dd>
  </dl>
