## Aim of the regulation

CSRD exists to solve a **trust and comparability problem**. Before it, companies could publish whatever ESG claims they liked, in whatever format, with no verification. That made it nearly impossible for investors, lenders and regulators to compare companies or catch greenwashing.

CSRD's aim is to give stakeholders sustainability information that is **reliable, relevant and comparable**, by putting it on the same statutory footing as financial reporting:

<div class="grid cols-3">
  <div class="tile"><div class="ic">📐</div><h4>Standardised</h4><p>One common format and mandatory disclosure topics.</p></div>
  <div class="tile"><div class="ic">🔍</div><h4>Verified</h4><p>Independent assurance of what is reported.</p></div>
  <div class="tile"><div class="ic">📑</div><h4>Statutory</h4><p>Part of the annual management report, not a brochure.</p></div>
</div>

CSRD is also designed to feed two other EU mechanisms: the **EU Taxonomy**, which needs companies' data to classify "green" economic activity, and the **CSDDD**, which needs companies' value-chain information to run due diligence.
