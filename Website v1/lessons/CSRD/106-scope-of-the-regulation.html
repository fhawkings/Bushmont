## Scope of the regulation

Scope is the part of CSRD that has changed most, and most recently. This page teaches the **current** rule, then shows how it got there, because you will meet both versions in the wild.

<div class="callout warn"><div class="ic">⚠️</div><div><b>Check the date on whatever you read</b><p>Articles from 2023 to early 2026 describe the <em>original</em> thresholds, which no longer apply.</p></div></div>

### Current scope

In force since 18 March 2026 (Directive (EU) 2026/470).

<div class="grid cols-3">
  <div class="stat"><div class="big">1,000+</div><span class="lbl">employees (average)</span></div>
  <div class="stat"><div class="big">€450m+</div><span class="lbl">net turnover</span></div>
  <div class="stat"><div class="big">FY2027</div><span class="lbl">first reporting year</span></div>
</div>

| Category | Threshold |
|---|---|
| EU-incorporated undertakings | In scope only if **both** the employee test (more than **1,000** employees on average in the financial year) **and** the turnover test (net turnover above **€450 million**) are met |
| Non-EU ultimate parent companies | In scope if net turnover generated **within the EU** exceeds **€450 million**, and the group has an EU subsidiary or branch with net turnover above **€200 million** |
| First reporting year | Financial years beginning **on or after 1 January 2027**, with the first reports published in 2028 for EU companies. Start dates for non-EU parents are set separately in the Directive: check the current text |

The test must be passed at the right level: the individual company or the consolidated group.

### How we got here

<ol class="steps">
  <li><b>Original CSRD (2022)</b>A wide, three-wave rollout. <strong>Wave 1</strong>: large public-interest entities already reporting under the NFRD (over 500 employees), from FY2024. <strong>Wave 2</strong>: other large undertakings (two of: over 250 employees, over €50m turnover, over €25m balance sheet), from FY2025. <strong>Wave 3</strong>: listed SMEs, from FY2026. Non-EU groups with over €150m EU turnover followed from FY2028.</li>
  <li><b>"Stop the clock" (Directive (EU) 2025/794, April 2025)</b>It did not change <em>who</em> was in scope. It pushed Wave 2 and Wave 3 reporting back by two years while the EU negotiated a permanent fix.</li>
  <li><b>Omnibus I (Directive (EU) 2026/470, in force March 2026)</b>The permanent fix. In scope only above both 1,000 employees and €450m net turnover. An estimated 80% of the originally in-scope companies were removed from the regime.</li>
</ol>

Member States may also choose to temporarily exempt companies that met the *old* Wave 1 thresholds but fall outside the new, narrower scope, for FY2025 and FY2026. This is at national discretion.

<div class="callout danger"><div class="ic">🎯</div><div><b>Worked example: Apex Holdings</b><p>Our simulation company has <strong>350 employees</strong> and about <strong>£520m (roughly €600m)</strong> revenue. It would have been in scope under the original 2022 rules, but it is very likely <strong>out of scope today</strong>: it clears the turnover test but fails the 1,000-employee test, and <em>both</em> must be met. Always check the currently applicable thresholds, not the headline you remember from a 2023 news article.</p></div></div>
</script>
