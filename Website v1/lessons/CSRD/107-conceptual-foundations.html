## Conceptual foundations

Two ideas hold the whole regulation together. If you forget every detail but remember these, you can rebuild the rest.

### 1. Double materiality

CSRD does not only ask "does this ESG topic matter to our investors?" That is **financial materiality**, the approach IFRS S1 and S2 take. CSRD asks two separate questions:

<div class="grid cols-2">
  <div class="tile"><div class="ic">🌍</div><h4>Impact materiality</h4><p>Does the company's activity significantly affect people or the environment?</p></div>
  <div class="tile"><div class="ic">💷</div><h4>Financial materiality</h4><p>Does the topic create a significant financial risk or opportunity for the company?</p></div>
</div>

<p class="pullquote">A topic must be reported if <span>either</span> answer is yes.</p>

This is the single biggest conceptual difference between CSRD/ESRS and investor-only frameworks such as ISSB. If you have taken the IFRS S1 and S2 course, keep this contrast in mind.

### 2. Sustainability reporting on the same footing as financial reporting

CSRD deliberately places disclosures **inside the management report** rather than a voluntary standalone report, and requires **independent assurance**.

<div class="callout warn"><div class="ic">⚠️</div><div><b>Recent change</b><p>The original plan was to move assurance towards the "reasonable assurance" standard used for financial audits. Omnibus I has capped it at <strong>limited assurance</strong>. The structural principle (statutory, mandatory, verified) remains, and it is what makes CSRD fundamentally different from voluntary frameworks such as GRI.</p></div></div>

<div class="divider-label">Sources for this section</div>

Directive (EU) 2022/2464; Directive (EU) 2025/794 ("stop the clock"); Directive (EU) 2026/470 ("Omnibus I", Official Journal, 26 February 2026); Directive 2013/34/EU (Accounting Directive, as amended).
