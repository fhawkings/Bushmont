## Core regulation

CSRD's rules work through the Accounting Directive it amends. Structurally, four things happen:

<ol class="steps">
  <li><b>It inserts a new obligation</b>In-scope undertakings must include a <strong>sustainability statement</strong> as a distinct section of their management report.</li>
  <li><b>It mandates a method for deciding what to disclose</b>The <strong>double materiality assessment</strong> (see Introduction).</li>
  <li><b>It requires a common EU standard</b>The <strong>European Sustainability Reporting Standards (ESRS)</strong>, rather than each company choosing its own framework. GRI, SASB and others may still be used as supplementary references, but ESRS is the mandatory baseline.</li>
  <li><b>It requires independent verification</b>A statutory auditor or independent assurance provider must give a <strong>limited assurance opinion</strong> on the sustainability statement.</li>
</ol>

### The ESRS

The ESRS are a **separate legal instrument**, adopted by Commission Delegated Regulation rather than written into CSRD itself. They are organised into cross-cutting standards and topical standards:

<div class="grid cols-2">
  <div class="tile"><div class="ic">📋</div><h4>ESRS 1: General requirements</h4><p>How to apply double materiality and structure the report.</p></div>
  <div class="tile"><div class="ic">🏛️</div><h4>ESRS 2: General disclosures</h4><p>Governance, strategy and the materiality assessment process itself.</p></div>
  <div class="tile"><div class="ic">🌱</div><h4>ESRS E1–E5: Environment</h4><p>Climate change, pollution, water and marine resources, biodiversity, resource use and circular economy.</p></div>
  <div class="tile"><div class="ic">👥</div><h4>ESRS S1–S4: Social</h4><p>Own workforce, workers in the value chain, affected communities, consumers and end-users.</p></div>
  <div class="tile"><div class="ic">⚖️</div><h4>ESRS G1: Governance</h4><p>Business conduct.</p></div>
</div>

<div class="callout warn"><div class="ic">⚠️</div><div><b>Recent change</b><p><strong>Sector-specific ESRS</strong> (originally planned as an extra layer on top of these standards) have been removed entirely by Omnibus I. The Commission has also adopted a simplified, streamlined version of the core ESRS in 2026, reducing the number of individual datapoints compared with the original 2023 set.</p></div></div>

<div class="divider-label">Sources for this section</div>

Directive 2013/34/EU (Accounting Directive) as amended by Directive (EU) 2022/2464 and Directive (EU) 2026/470; Commission Delegated Regulation (EU) 2023/2772 (ESRS), as revised in 2026.
