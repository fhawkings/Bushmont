## Attributes of the regulation

What makes CSRD different from other regimes. Use this as a comparison table against IFRS S1 and S2, or voluntary frameworks such as GRI.

| Attribute | CSRD | Contrast |
|---|---|---|
| Materiality lens | **Double** (impact and financial) | ISSB / IFRS S1–S2: financial materiality only (investor-focused) |
| Legal status | Mandatory and statutory (part of the management report) | GRI: voluntary framework |
| Assurance | Mandatory **limited** assurance (the move to reasonable assurance was dropped by Omnibus I) | Many voluntary frameworks: no assurance requirement |
| Standard-setter | EFRAG (an EU advisory body); standards adopted by the European Commission | ISSB: independent international board. GRI: independent NGO |
| Scope test | Size thresholds (employees and turnover); EU-incorporated, or linked through EU turnover | Sector- or listing-based tests elsewhere |
| Extraterritorial reach | Yes: non-EU parent companies with enough EU turnover are in scope | Not all comparable regimes reach beyond their home jurisdiction |
| Digital format | Machine-readable tagging required | Not universal across voluntary frameworks |

<div class="callout"><div class="ic">💡</div><div><b>Why this matters</b><p>If you can explain these attributes, you can compare CSRD with any other regime you meet: ask the same seven questions each time.</p></div></div>
