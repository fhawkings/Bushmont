## Requirements of the regulation

The literal compliance checklist: what an in-scope company must produce, disclose or do. This is the page to keep open during the exam.

<ol class="steps">
  <li><b>Confirm in-scope status</b>Apply the current employee and turnover thresholds, at the correct level (individual company or consolidated group).</li>
  <li><b>Conduct a double materiality assessment</b>Screen every ESRS topic (E1–E5, S1–S4, G1) for impact materiality and financial materiality, and document the process itself as ESRS 2 requires.</li>
  <li><b>Determine the value chain boundary</b>Identify which upstream and downstream impacts are material enough to disclose, even where direct data is not yet available.</li>
  <li><b>Draft the sustainability statement</b>Structure it per the ESRS 1 and ESRS 2 general disclosures, followed by the material topical standards identified in step 2.</li>
  <li><b>Ensure connectivity</b>The statement must cross-reference, and be consistent with, the financial statements and the rest of the management report. This is a specific, checkable ESRS requirement.</li>
  <li><b>Tag the report digitally</b>Use the required machine-readable format.</li>
  <li><b>Obtain limited assurance</b>From a statutory auditor or an accredited independent assurance provider.</li>
  <li><b>File on time</b>Within the statutory deadline for the financial year, as part of the management report.</li>
</ol>
</script>
