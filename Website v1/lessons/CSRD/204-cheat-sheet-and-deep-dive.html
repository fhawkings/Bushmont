## Cheat sheet and deep dive

### Everything you need to know

<div class="callout"><div class="ic">📌</div><div><b>One-page summary</b><p>The points to remember if you remember nothing else.</p></div></div>

- CSRD is an **amending directive**, not a standalone rulebook. It lives inside the Accounting Directive.
- Reporting happens in the **management report**, not a separate glossy document.
- **Double materiality** decides what to disclose: impact *or* financial materiality triggers it.
- **ESRS** is the mandatory standard. Sector-specific ESRS have been scrapped and the core standards simplified (2026).
- Current scope (since March 2026): **over 1,000 employees *and* over €450m turnover** for EU companies; **over €450m EU turnover** (with a qualifying EU subsidiary or branch) for non-EU parents.
- First reporting year for newly defined in-scope EU companies: **FY2027**, with reports published in **2028**.
- Assurance: **limited assurance only**. The move to reasonable assurance was dropped.
- Penalties for breaching CSRD are set by **each Member State** in national law.
- CSRD is distinct from the **CSDDD** (supply-chain due diligence) and the **EU Taxonomy** (classifying green activity). They are related regimes, not the same law, and they share data.

<div class="divider-label">Optional deep dive</div>

Reference material, not required reading. Open whatever interests you.

<details><summary>Transition plans</summary><div class="body"><p>The duty to <em>adopt and put into effect</em> a climate transition plan sat in the <strong>CSDDD</strong>, and Omnibus I deleted it entirely. CSRD still requires a company to <em>disclose</em> its transition plan if it has one, but it does not force a company to create one.</p></div></details>

<details><summary>The assurance roadmap</summary><div class="body"><p>The Commission must adopt harmonised EU-wide limited assurance standards by <strong>1 July 2027</strong>. Until then, assurance practice varies somewhat between Member States.</p></div></details>

<details><summary>What happens to companies no longer in scope?</summary><div class="body"><p>Companies that fall outside CSRD's new, narrower scope (including many former Wave 1 reporters) can still report voluntarily using the lighter <strong>VSME</strong> standard.</p></div></details>

<details><summary>Member State transposition</summary><div class="body"><p>CSRD is a <em>directive</em>, not a regulation: it does not apply automatically. Each Member State must transpose it into national law (the deadline for the CSRD changes in Omnibus I is <strong>19 March 2027</strong>), so exact national rules can vary at the margins until that is complete.</p></div></details>

<details><summary>Enforcement patchiness</summary><div class="body"><p>Several Member States were already late transposing the <em>original</em> 2022 text before Omnibus I arrived. EU timelines on paper and actual national implementation dates can diverge.</p></div></details>
