## Foreword - to be rewriten

This guide acts as the skeleton for the Bushmont course on IFRS S1 and S2. In the past 3 years since its inception S1 and S2 have skyrocketed in popularity, and is being adopted by more and more governments each year. This course provides the conceptual foundations and is designed for all levels of sustainability knowledge. From experts to those that don’t know what sustainability fully means.

This course is split into 5 sections, starting with the conceptual foundations to give students a good grasp of the basics in sustainability and finishes with a report writing exercise where students will be given a realistic scenario and must produce their own IFRS report.
