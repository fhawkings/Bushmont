## Your lesson title

          2.1 Sustainability reporting and how IFRS and the ISSB fits into that
Sustainability reporting has taken the world by storm in the past decade. From being voluntary, countries are increasingly introducing compulsory frameworks.
There are a number of different frameworks for details follow this link: 
ISSB-2023-A - Issued IFRS Standards

A big issue with a lack of regulation, was the lack of comparability between companies, with each company able to use its own definitions and metrics. As such investors and other stakeholders were unable to compare and price the risks that climate change posed to firms. As extreme weather events have increased, businesses have been increasingly disrupted and their finances effects, combined with investors looking for more resilient companies. 
The result of these demands has been IFRS S1 and S2. This makes sustainability reporting no longer a voluntary communicative statement, but a finical obligation.
###2.1.2 What are the ISSB
The International Sustainability Standards Board (ISSB) is the organisation which is in charge of developing IFRS Sustainability Disclosure Standards. Established at COP 2026 as a branch of the IFRS Foundation, the organisation which is in charge of the International Accounting Standards Board (IASB).
The ISSB has four key objectives:
1)	“to develop standards for a global baseline of sustainability disclosures;
2)	to meet the information needs of investors;
3)	to enable companies to provide comprehensive sustainability information to global capital markets; and
4)	to facilitate interoperability with disclosures that are jurisdiction-specific and/or aimed at broader stakeholder groups.”
(IFRS - International Sustainability Standards Board)
###2.1.3 ISSB Predecessors
Climate Disclosure Standards Board (CDSB)
Established in 2007, the CDSB developed a framework for reporting environmental related information in corporate reporting. It was merged into IFRS in 2022
Sustainability Accounting Standards Board (SASB)
Established in 2011 the SASB developed industry specific sustainability metrics across 77 industries, and was essentially merged with IFRS in 2022. The SASB standards are still an important and used part of the ISSB frameworks.
International Integrated Reporting Council (IIRC)
Established in 2010, created reporting frameworks which focused on integrating financial and non financial information, this was essentially merged with IFRS in 2022.
Task Force on Climate Related Financial Disclosures (TCFD)
Established in 2015, developed a four pillar disclosure framework, and forms the structural backbone of IFRS S2. TCFD was disbanded in 2023, with ISSB taking over monitoring of climate related disclosure progress.
###2.1.4 Other frameworks and where ISSB fits
Whilst IFRS S1/S2 are made of several different frameworks and organisations, there are still several other major sustainability reporting frameworks, which you may come across in your career.
Global Reporting Initiative (GRI)
A widely used sustianbility reporting framework, GRI uses double fmateriality looking at both how sustainability affects a company, and how a company effects the environment and society. IFRS S1/S2 are designed to be complementary to GRI, with the advice to report to both standards if possible.
EU (Corporate Sustainability Reporting Directive) CSRD
The EUs flagship sustainability policy, it uses double materiality, and is deeper than S1/S2 and applies to a larger portion of companies, including non-EU companies with significant operations in the EU. 
Carbon Disclosure Project (CDP)
A platform for climate, water, and forest related disclosures. In 2024 CDP aligned its questionnaire with S2 to make it easier for companies to report on both.
Taskforce on Nature related Financial Disclosures (TNFD)
A nature focused version of TCF, providing a framework for national and biodiversity related risks. As ISSB developed more topic specific standards beyond climate, it is likely the TNFD work will become highly important.
IFRS S1/S2 is seen as the global baseline, or the floor. Other frameworks provide more information layer on top of IFRS S1/S2.
