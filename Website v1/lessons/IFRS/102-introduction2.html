Hello and Welcome to the Bushmont course on IFRS S1 and S2. We are delighted to have you with us. S1 and S2 have started to take the world by storm as the universal framework to report on a companies sustainability. I’m stood outside senate house in London, which was home to the Ministry of Truth in the film 1984 based on the book of the same name by George Orwell. One of the key themes in 1984 is the notion that information is power. Its this same premise which drives S1 and S2, with the aim of IFRS to provide a reporting framework which gives information to investors so they can make well informed decisions. The idea is that when people have full information they make the right decisions.
