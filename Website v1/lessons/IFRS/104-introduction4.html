##What are IFRS S1 and S2?

IFRS S1 and S2 are global regulatory frameworks that provide a standardised way of how an organisaiton should display information about sustainability to its investors.
- S1 covers general sustainability topics
- S2 covers climate topics

IFRS S1 and S2 were published on the 26th of June 2023 by the International Sustainabiloity Standards Board, with the aim of standardising sustainbility reporting to a similar standard to that of finacial information.
