## Aim of the regulation
Before the ISSB sustainability reporting was a mix of many different reporting frameworks, which made it hard to compare companies, and companies could pick the framework that made their company look the best
IFRS S1 and S2 was created to be a single gobal standard so that sustainbility information was comparable across comapnies, enabiling investors to make easily informed decisions when it comes to taking into acount sustainbility information.

## Scope of the Regulaiton
Whilst the ISSB set the standards, they do not decide where S1 and S2 are required and inforced, it is up to individual countries to decide.
The map below shows the countries that have decided to adopt IFRS s1 and S2. As of 2026 35 countries have adopted IFRS S1 and S2 and 11 are at the planning stage.
