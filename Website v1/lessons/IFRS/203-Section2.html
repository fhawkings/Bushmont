## 2.2 IFRS S1 and S2 - very basic intro - what they do, relation to each other, who do they apply to, etc.
2.2.1 S1
S1 establishes a general overarching framework for disclosing information about both sustainability risks and opportunities. Any sustainability topics that are considered financially material to a business. S1 covers all sustainability topic including: climate, water, biodiversity, social, governance, and any other areas where sustainability is seen as important.
Key Features:
•	Four pillar foundation - Establishes a four pillar disclosure structure that sustainability disclosures should follow: Governance, Strategy, Risk Management, and Merics and Targets.
•	Materiality - Focus on financial materiality
•	Integrated Reporting - Links sustainability and financial report
•	Applies to all sustainability topics
2.2.2 S2
S2 zooms into climate. It focuses just on climate as it is considered the most urgent issue, and provides specific guidance for climate related disclosures, building on S1.
Key features:
•	Four pillar foundation - Uses the same structure as S1, but adds climate specific requirements for each pillar
•	Risks - requires disclosure of both physical and transition risks
•	Emissions - Disclosure of Scope 1,2, and 3 emissions
•	
S2 does not replace S1, although when you report S2 you are also reporting S1, you are simply supplementing it with climate specific details.
S1 is said to be like the constitution with S2 being detailed legislation for an area
2.2.3 Who this applies to
IFRS does not have any legal mandate, it is up to individual countries to decide whether to implement S1 and S2 and to what extent this should be done. The map below shows details of this. Along with a table listing more details about individual countries

2.2.4 I'm not mandated by my country to report S1 and S2 should I still do it.
Yes! Whilst not every country requires S1/S2 there are good reasons to being compliance today.
1.	Mandatory requirements tend to arrive faster than companies expect
-	Global adoption rates are accelerating, the earlier the company beings to adopt a standard the easier it is when these standards become legal requirements
2.	Investor Pressure
-	Investors increasingly demand ESG data, providing it in a structure globally approved way can be a real asset
-	Allows you to be compared to other companies meaning if your doing well it’s a really strong sign to investors
3.	Reputation
-	Transparency on emissions can lead to good reputation
Companies that tend to lag face increasing pressure and scrutiny and higher costs later down the line.
