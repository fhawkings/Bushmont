## Cards & grids

Grids turn a list into something scannable. Drop items into a `grid` with
`cols-2` or `cols-3` — they stack automatically on a phone.

<div class="grid cols-3">
  <div class="tile"><div class="ic">📘</div><h4>Learn</h4><p>Short lessons you can finish in a few minutes.</p></div>
  <div class="tile"><div class="ic">🧭</div><h4>Practise</h4><p>Worked examples to follow along with.</p></div>
  <div class="tile"><div class="ic">✅</div><h4>Apply</h4><p>Checklists you can use in real work.</p></div>
</div>

The same grid works for **stat tiles** — handy for a results or summary page:

<div class="grid cols-3">
  <div class="stat"><div class="big">7</div><span class="lbl">lessons</span></div>
  <div class="stat"><div class="big">3</div><span class="lbl">sections</span></div>
  <div class="stat"><div class="big">~45m</div><span class="lbl">to complete</span></div>
</div>

### Copy this

```html
<div class="grid cols-3">
  <div class="tile">
    <div class="ic">📘</div>
    <h4>Title</h4>
    <p>One line of description.</p>
  </div>
  <!-- repeat the tile for each card -->
</div>

<div class="grid cols-3">
  <div class="stat">
    <div class="big">7</div>
    <span class="lbl">label</span>
  </div>
</div>
```

Use `cols-2` for two across, or leave the modifier off for a single column.
