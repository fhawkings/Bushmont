## Buttons, badges & tags

A **button** is just a styled link — point it at the next lesson, a download,
or anything on the web.

<div class="btn-row">
  <a class="btn" href="#">Primary action</a>
  <a class="btn outline" href="#">Secondary</a>
</div>

**Badges** label a status; **tags** list topics at a glance.

<p><span class="badge">New</span> &nbsp; <span class="badge">Beginner</span> &nbsp; <span class="badge">5 min</span></p>

<div class="tags">
  <span class="tag">introduction</span>
  <span class="tag">setup</span>
  <span class="tag">examples</span>
  <span class="tag">reference</span>
</div>

### Copy this

```html
<div class="btn-row">
  <a class="btn" href="lessons/course-1/02-how-this-works.html">Next lesson</a>
  <a class="btn outline" href="#">Secondary</a>
</div>

<span class="badge">New</span>

<div class="tags">
  <span class="tag">topic</span>
  <span class="tag">topic</span>
</div>
```
